name: Weekly picks and backtest refresh

on:
  schedule:
    - cron: "30 13 * * 6"        # Saturday 19:00 IST (data repo updates weekly)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          PYTHONPATH: src
      - run: bash scripts/download_data.sh
      - name: Backtest and latest picks
        env:
          PYTHONPATH: src
        run: |
          python -m mat backtest
          python -m mat picks
      - name: Commit refreshed charts and picks
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f results/*.png results/summary.csv results/picks_*.csv
          git commit -m "Weekly refresh $(date +%F)" || echo "nothing to commit"
          git push
